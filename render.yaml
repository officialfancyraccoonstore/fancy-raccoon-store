services:
  - type: web
    name: fancy-raccoon-store
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OWNER_EMAIL
        value: officialfancyraccoon.store@gmail.com
      - key: ADMIN_PASSWORD
        value: rocket107
      - key: ADMIN_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        value: officialfancyraccoon.store@gmail.com
      - key: MAIL_FROM_NAME
        value: Fancy Raccoon
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: officialfancyraccoon.store@gmail.com
      - key: SMTP_PASS
        sync: false
