services:
  - type: web
    name: fancy-raccoon-store
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OWNER_EMAIL
        value: officialfancyraccoon.store@gmail.com
      - key: ADMIN_PASSWORD
        value: rocket107
      - key: ADMIN_SECRET
        value: rocket107
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: officialfancyraccoon.store@gmail.com
      - key: SMTP_PASS
        sync: false
