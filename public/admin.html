<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fancy Raccoon · Studio dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=6">
<link rel="stylesheet" href="/css/admin.css?v=6">
<link rel="stylesheet" href="/css/theme.css?v=6">
<link rel="manifest" href="/admin.webmanifest">
<meta name="theme-color" content="#0d0c0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FR Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
</head>
<body class="admin-body">
<header class="admin-header">
  <div class="admin-header-inner">
    <div class="brand">
      <img src="/img/logo.png" alt="Fancy Raccoon" width="42" height="42" style="border-radius:50%">
      <span class="brand-text"><strong>STUDIO</strong><small>Fancy Raccoon</small></span>
    </div>
    <div class="admin-header-actions">
      <button class="admin-ghost" id="installAppBtn" type="button" hidden>Install app</button>
      <a class="admin-link" href="/" target="_blank" rel="noopener">View store ↗</a>
      <button class="admin-ghost" id="logoutBtn" type="button" hidden>Log out</button>
    </div>
  </div>
</header>

<!-- LOGIN -->
<section class="login-wrap" id="loginView">
  <form class="login-card" id="loginForm">
    <p class="eyebrow">Secure area</p>
    <h1>Studio dashboard</h1>
    <p class="login-sub">Sign in to see custom orders, design briefs, reference images and customer details.</p>
    <label class="field">
      <span>Admin password</span>
      <input type="password" id="loginPassword" autocomplete="current-password" required autofocus>
    </label>
    <p class="form-error" id="loginError" hidden></p>
    <button class="btn btn-primary btn-block" type="submit" id="loginSubmit">Sign in</button>
    <p class="fineprint">Sessions expire after 8 hours. Failed attempts are rate limited.</p>
  </form>
</section>

<!-- DASHBOARD -->
<section class="dash" id="dashView" hidden>
  <div class="dash-inner">
    <div class="dash-top">
      <div>
        <p class="eyebrow">Live orders</p>
        <h1>Today at the studio</h1>
      </div>
      <div class="email-status" id="emailStatus"></div>
      <div class="email-status" id="storageStatus"></div>
    </div>

    <div class="stat-grid" id="statGrid"></div>

    <div class="tabs">
      <button class="tab is-active" type="button" data-tab="orders">Orders</button>
      <button class="tab" type="button" data-tab="products">Products &amp; pricing</button>
    </div>

    <div id="ordersPanel">
      <div class="toolbar">
        <div class="status-filters" id="statusFilters"></div>
        <label class="admin-search">
          <input type="search" id="orderSearch" placeholder="Search order code, name, phone, city">
        </label>
        <button class="admin-ghost" id="refreshBtn" type="button">Refresh</button>
      </div>
      <div class="orders-list" id="ordersList"></div>
    </div>

    <div id="productsPanel" hidden>
      <div class="orders-list" id="productsList"></div>
    </div>
  </div>
</section>

<!-- ORDER DETAIL -->
<div class="admin-modal" id="orderModal" hidden>
  <div class="admin-modal-card">
    <button class="icon-btn admin-modal-close" id="orderModalClose" type="button" aria-label="Close">✕</button>
    <div id="orderDetail"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/js/admin.js" defer></script>
</body>
</html>
